# XcodeGen spec. The .xcodeproj is generated from this file; never edit the project by hand.
#   nix run nixpkgs#xcodegen -- generate
name: Sable
options:
  bundleIdPrefix: com.sadiq
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      DEPLOYMENT_POSTPROCESSING: YES
targets:
  Sable:
    type: application
    platform: iOS
    sources: [Sable]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sadiq.sable
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D342SBUL8R  # free Personal Team; apps signed with it expire after 7 days, press Run again
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Sable
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlocks Sable so only you can see your money.
        INFOPLIST_KEY_NSContactsUsageDescription: Shows contact names for the people you pay over UPI. Contacts never leave this phone.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # A "Sable" folder in the Files app, so seed and SMS files can be dropped in and imported.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
# Run installs the Release build: optimised, stripped (about 2.6 MB on the phone instead of 12 MB) and what you
# actually use day to day. Pick Debug in the scheme editor when you need the debugger.
schemes:
  Sable:
    build:
      targets:
        Sable: all
    run:
      config: Release
